openapi: 3.1.0
info:
  title: 企业级 AI Agent Harness API
  description: 用于企业级 AI Agent Harness 平台的任务、事件、沙箱、审计和设置 API。
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: 健康检查
      description: 返回 API 服务健康状态。
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/tasks:
    post:
      tags:
      - tasks
      summary: 创建任务
      description: 创建一条新的任务记录，并写入 TASK_CREATED 事件。
      operationId: create_task_api_tasks_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - tasks
      summary: 查询任务列表
      description: 按组织查询任务列表，支持状态过滤和分页大小。
      operationId: list_tasks_api_tasks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}:
    get:
      tags:
      - tasks
      summary: 查询任务详情
      description: 返回指定任务的完整基础信息。
      operationId: get_task_api_tasks__task_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/start:
    post:
      tags:
      - tasks
      summary: 启动任务
      description: 将 CREATED 或 FAILED 任务启动为运行态。
      operationId: start_task_api_tasks__task_id__start_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/cancel:
    post:
      tags:
      - tasks
      summary: 取消任务
      description: 将当前任务状态切换为 CANCELLED，并写入 TASK_CANCELLED 事件。
      operationId: cancel_task_api_tasks__task_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/resume:
    post:
      tags:
      - tasks
      summary: 恢复任务
      description: 将 FAILED 或 CANCELLED 任务恢复为 RUNNING，并写入 TASK_RESUMED 事件。
      operationId: resume_task_api_tasks__task_id__resume_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/steps/resume:
    post:
      tags:
      - tasks
      summary: 从指定步骤续跑任务
      description: 将 FAILED 或 CANCELLED 任务按最新执行计划恢复，从请求中最靠前的步骤键开始续跑，已完成步骤写入 STEP_SKIPPED。
      operationId: resume_task_steps_api_tasks__task_id__steps_resume_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepResumeRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResumeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/result:
    get:
      tags:
      - tasks
      summary: 查询任务结果
      description: 返回任务状态、摘要、执行计划、产物列表和最后事件序号。
      operationId: get_task_result_api_tasks__task_id__result_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/plan:
    get:
      tags:
      - tasks
      summary: 查询任务执行计划
      description: 返回任务最新执行计划，并合并已落库步骤的当前状态。
      operationId: get_task_plan_api_tasks__task_id__plan_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/plans:
    get:
      tags:
      - tasks
      summary: 查询任务计划版本
      description: 返回任务全部执行计划版本，用于计划变更对比。
      operationId: list_task_plan_versions_api_tasks__task_id__plans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanVersionPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/plans/diff:
    get:
      tags:
      - tasks
      summary: 对比任务计划版本
      description: 按两个计划版本对比步骤新增、移除和变更。
      operationId: diff_task_plan_versions_api_tasks__task_id__plans_diff_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: from_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: From Version
      - name: to_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: To Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanDiffResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/steps:
    get:
      tags:
      - tasks
      summary: 查询任务步骤
      description: 返回任务已执行或已派生的步骤状态列表。
      operationId: list_task_steps_api_tasks__task_id__steps_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStepPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/replay:
    post:
      tags:
      - tasks
      summary: 重放任务状态
      description: 根据事件流和快照重放任务状态，返回故障点和诊断摘要。
      operationId: replay_task_api_tasks__task_id__replay_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/model-calls:
    get:
      tags:
      - tasks
      summary: 查询模型调用
      description: 返回当前任务关联的模型调用审计列表。
      operationId: list_model_calls_api_tasks__task_id__model_calls_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCallPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/tool-calls:
    get:
      tags:
      - tasks
      summary: 查询工具调用
      description: 返回当前任务关联的工具调用审计列表。
      operationId: list_tool_calls_api_tasks__task_id__tool_calls_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: tool_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 工具名称，支持包含匹配
          title: Tool Name
        description: 工具名称，支持包含匹配
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 调用状态
          title: Status
        description: 调用状态
      - name: risk_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 风险等级
          title: Risk Level
        description: 风险等级
      - name: trace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Trace ID
          title: Trace Id
        description: Trace ID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: 返回数量
          default: 100
          title: Limit
        description: 返回数量
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/tools/execute:
    post:
      tags:
      - tasks
      summary: 执行任务工具
      description: 按工具注册表和策略执行工具，并写入工具调用审计与事件流。
      operationId: execute_task_tool_api_tasks__task_id__tools_execute_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExecuteRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecuteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/events:
    get:
      tags:
      - events
      summary: 查询任务事件
      description: 返回指定任务的事件溯源流，支持从指定序号之后读取。
      operationId: list_task_events_api_tasks__task_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: after_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: After Sequence
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/events/stream:
    get:
      tags:
      - events
      summary: 订阅任务事件流
      description: 通过 Server-Sent Events 持续推送任务事件。
      operationId: stream_task_events_api_tasks__task_id__events_stream_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: after_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: After Sequence
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/settings/models:
    get:
      tags:
      - settings
      summary: 查询模型设置
      description: 返回模型网关、供应商、限流和健康状态。
      operationId: get_model_settings_api_settings_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettingsResponse'
      security:
      - HTTPBearer: []
    put:
      tags:
      - settings
      summary: 更新模型设置
      description: 仅 admin 可更新模型网关设置。
      operationId: update_model_settings_api_settings_models_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSettingsResponse'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/settings/models/health:
    get:
      tags:
      - settings
      summary: 查询模型健康状态
      description: 按当前组织模型设置返回供应商健康状态和探测结果。
      operationId: get_model_health_api_settings_models_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelHealthPage'
      security:
      - HTTPBearer: []
  /api/settings/models/fallbacks:
    get:
      tags:
      - settings
      summary: 查询模型 fallback 观测
      description: 按当前组织聚合模型 fallback 事件、主模型失败次数和最近 fallback 明细。
      operationId: get_model_fallbacks_api_settings_models_fallbacks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFallbackSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/settings/policies:
    get:
      tags:
      - settings
      summary: 查询策略设置
      description: 返回工具风险、审批规则、沙箱规则和审计要求。
      operationId: get_policy_settings_api_settings_policies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySettingsResponse'
      security:
      - HTTPBearer: []
    put:
      tags:
      - settings
      summary: 更新策略设置
      description: 仅 admin 可更新策略设置。
      operationId: update_policy_settings_api_settings_policies_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySettingsResponse'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySettingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/tasks/{task_id}/subagents:
    get:
      tags:
      - subagents
      summary: 查询任务子 Agent
      description: 返回指定任务派生出的子 Agent 列表。
      operationId: list_task_subagents_api_tasks__task_id__subagents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - subagents
      summary: 创建任务子 Agent
      description: 为指定任务派生一个子 Agent，并写入 SUBAGENT_SPAWNED 事件。
      operationId: create_task_subagent_api_tasks__task_id__subagents_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubagentCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/subagents:
    get:
      tags:
      - subagents
      summary: 查询组织子 Agent 列表
      description: 返回当前组织全部子 Agent，支持按状态筛选，用于批量运营视图。
      operationId: list_subagents_api_subagents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 子 Agent 状态
          title: Status
        description: 子 Agent 状态
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: 返回数量
          default: 100
          title: Limit
        description: 返回数量
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentListPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/subagents/recover:
    post:
      tags:
      - subagents
      summary: 恢复任务子 Agent
      description: 基于 Replay 状态恢复超时或卡住的子 Agent，并按需重新入队。
      operationId: recover_task_subagents_api_tasks__task_id__subagents_recover_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubagentRecoverRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
