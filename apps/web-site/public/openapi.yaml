components:
  schemas:
    CountItem:
      properties:
        name:
          type: string
          title: Name
          description: 名称
        count:
          type: integer
          title: Count
          description: 数量
      type: object
      required:
      - name
      - count
      title: CountItem
    EventPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EventResponse'
          type: array
          title: Items
          description: 事件列表
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 下一页游标
      type: object
      required:
      - items
      title: EventPage
    EventResponse:
      properties:
        id:
          type: string
          title: Id
          description: 事件 ID
        task_id:
          type: string
          title: Task Id
          description: 任务 ID
        agent_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Run Id
          description: Agent 运行 ID
        sequence:
          type: integer
          title: Sequence
          description: 事件序号
        event_type:
          type: string
          title: Event Type
          description: 事件类型
        payload_json:
          additionalProperties: true
          type: object
          title: Payload Json
          description: 事件载荷
        actor_type:
          type: string
          title: Actor Type
          description: 来源类型
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
          description: 来源 ID
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
          description: 追踪 ID
        created_at:
          type: string
          format: date-time
          title: Created At
          description: 创建时间
      type: object
      required:
      - id
      - task_id
      - sequence
      - event_type
      - payload_json
      - actor_type
