            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilitySummaryResponse'
      security:
      - HTTPBearer: []
  /api/observability/logs:
    get:
      tags:
      - observability
      summary: 查询结构化日志
      description: 按任务、trace、服务和事件类型查询结构化日志；Loki 不可用时返回 Event Store 日志视图。
      operationId: list_observability_logs_api_observability_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 任务 ID
          title: Task Id
        description: 任务 ID
      - name: trace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Trace ID
          title: Trace Id
        description: Trace ID
      - name: service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 服务名
          title: Service
        description: 服务名
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 事件类型
          title: Event Type
        description: 事件类型
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: 返回数量
          default: 100
          title: Limit
        description: 返回数量
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityLogPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/observability/traces/{trace_id}:
    get:
      tags:
      - observability
      summary: 查询 Trace 链路
      description: 按 trace_id 查询链路；外部 Trace 后端未接入时返回 Event Store 合成 span。
      operationId: get_observability_trace_api_observability_traces__trace_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
