<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Seed Workspace Demo</title>
  </head>
  <body>
    <script>
      (() => {
        const localHosts = new Set(["127.0.0.1", "localhost"]);
        if (!localHosts.has(location.hostname)) {
          document.body.textContent = "Demo workspace seed is available only on localhost.";
          return;
        }
        const now = new Date().toISOString();
        const key = "harness.workspace.v3.default.conversations";
        localStorage.setItem("harness.auth.access_token", "dev-admin-token");
        localStorage.setItem("harness.auth.refresh_token", "dev-admin-token");
        const root = (children) => ({
          id: "root",
          parent_id: null,
          children_ids: children,
          role: "system",
          content: "Agent Workspace Pro root",
          state: "done",
          metadata: {},
          tool_calls: [],
          artifacts: [],
          created_at: now,
        });
        const chartUser = {
          id: "demo-chart-user",
          parent_id: "root",
          children_ids: ["demo-chart-assistant"],
          role: "user",
          content: "生成一个销售趋势图表",
          state: "done",
          metadata: { workspace_mode: "chat" },
          tool_calls: [],
          artifacts: [],
          created_at: now,
        };
        const chartAssistant = {
          id: "demo-chart-assistant",
          parent_id: "demo-chart-user",
          children_ids: [],
          role: "assistant",
          content: "这是一个 chart artifact 示例。点击下方 sales-by-day.chart 的“打开”，右侧“产物 / 预览”会显示 ECharts 折线图。",
          state: "done",
          metadata: {
            workspace_mode: "chat",
            input_tokens: 18,
            output_tokens: 42,
            cost_usd: "0.0001",
            duration_ms: 320,
            ttfb_ms: 54,
          },
          tool_calls: [],
          artifacts: [
            {
              id: "demo-chart-artifact-sales-by-day",
              name: "sales-by-day.chart",
              artifact_type: "chart",
              status: "created",
              content: {
                chartType: "line",
                xAxis: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                series: [
                  { name: "Revenue", data: [120, 180, 150, 260, 310, 420, 390] },
                  { name: "Orders", data: [30, 45, 38, 62, 74, 96, 88] },
                ],
              },
              run_id: "demo-tool-approval-run",
            },
          ],
          run_id: "demo-tool-approval-run",
          created_at: now,
        };
        const ttfbUser = {
          id: "demo-ttfb-user",
          parent_id: "root",
          children_ids: ["demo-ttfb-assistant"],
          role: "user",
          content: "展示流式首字节延迟指标",
          state: "done",
          metadata: { workspace_mode: "chat" },
          tool_calls: [],
          artifacts: [],
          created_at: now,
        };
        const ttfbAssistant = {
          id: "demo-ttfb-assistant",
          parent_id: "demo-ttfb-user",
          children_ids: [],
          role: "assistant",
          content: "这是 TTFB metadata 示例。消息底部应显示输入、输出、花费、耗时、TTFB。",
          state: "done",
          metadata: {
            workspace_mode: "chat",
            input_tokens: 20,
            output_tokens: 64,
            cost_usd: "0.0002",
            duration_ms: 1234,
            ttfb_ms: 123,
          },
          tool_calls: [],
          artifacts: [],
          run_id: "demo-tool-approval-run",
          created_at: now,
        };
        const chartConversation = {
          id: "conv-chart-artifact-demo",
          title: "Chart Artifact 示例",
          created_at: now,
          updated_at: now,
          nodesById: { root: root(["demo-chart-user"]), "demo-chart-user": chartUser, "demo-chart-assistant": chartAssistant },
          rootNodeId: "root",
          activeLeafId: "demo-chart-assistant",
          pinnedNodeIds: [],
          dismissedPlanNodeIds: [],
          draft: "",
          contextWindowTurns: 12,
          contextCompressions: {},
        };
        const ttfbConversation = {
          id: "conv-ttfb-metadata-demo",
          title: "TTFB Metadata 示例",
          created_at: now,
          updated_at: now,
          nodesById: { root: root(["demo-ttfb-user"]), "demo-ttfb-user": ttfbUser, "demo-ttfb-assistant": ttfbAssistant },
          rootNodeId: "root",
          activeLeafId: "demo-ttfb-assistant",
          pinnedNodeIds: [],
          dismissedPlanNodeIds: [],
          draft: "",
          contextWindowTurns: 12,
          contextCompressions: {},
        };
        const existing = JSON.parse(localStorage.getItem(key) || '{"version":2,"conversations":[],"currentConversationId":""}');
        const conversations = Array.isArray(existing.conversations) ? existing.conversations : [];
        const filtered = conversations.filter((conversation) => !["conv-chart-artifact-demo", "conv-ttfb-metadata-demo"].includes(conversation.id));
        localStorage.setItem(key, JSON.stringify({
          version: 2,
          conversations: [chartConversation, ttfbConversation, ...filtered],
          currentConversationId: "conv-chart-artifact-demo",
        }));
        location.replace("/agents/default/workspace?conversation_id=conv-chart-artifact-demo&run_id=demo-tool-approval-run");
      })();
    </script>
  </body>
</html>
