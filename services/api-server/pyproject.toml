[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-api-server"
version = "0.1.0"
description = "FastAPI backend for the Forge Harness enterprise AI control plane."
requires-python = "==3.11.*"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "rich>=13.9.0,<14.0.0",
  "textual>=0.86.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "redis>=5.0.0,<6.0.0",
  "dramatiq>=1.17.0,<2.0.0",
  "docker>=7.1.0,<8.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "opentelemetry-api>=1.25.0,<2.0.0",
  "opentelemetry-sdk>=1.25.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0,<2.0.0",
  "jsonschema>=4.23,<5",
  "aiosmtplib>=3.0.0,<4.0.0",
  "cryptography>=46.0.5,<50.0.0",
  "python3-saml>=1.16.0,<2.0.0",
  "psycopg2-binary>=2.9.9,<3.0.0",
  "psutil>=6.0.0,<7.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "python-multipart>=0.0.6,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0.0",
  "ruff>=0.6.0,<1.0.0"
]
sidecar = [
  "pyinstaller>=6.11.0,<7.0.0"
]

[project.scripts]
hao = "app.cli.hao:main"
harnessd = "app.cli.harnessd:main"
harness-import-local-data = "app.cli.import_local_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
