services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: harness-api:ci
    build:
      context: ./services/api-server
      dockerfile: Dockerfile.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      REDIS_URL: redis://redis:6379/0
      MODEL_GATEWAY_BASE_URL: http://api:8000/mock-model
      MODEL_GATEWAY_API_KEY: ci
      DEEPSEEK_API_KEY: ""
    ports:
      - "18080:8000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport json, urllib.request\nr=urllib.request.urlopen('http://127.0.0.1:8000/api/health/readiness', timeout=5)\nraise SystemExit(0 if json.load(r).get('ready') else 1)\nPY"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  console:
    image: harness-console:ci
    build:
      context: ./apps/agent-console
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: http://127.0.0.1:18080
        VITE_DEV_BEARER_TOKEN: dev-engineer-token
        VITE_DEV_ADMIN_BEARER_TOKEN: dev-admin-token
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "18081:80"
