services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
      agent-console:
        condition: service_started
      static-assets:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      HARNESS_DOMAIN: ${HARNESS_DOMAIN:-localhost}
      HARNESS_EMAIL: ${HARNESS_EMAIL:-admin@example.invalid}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  agent-console:
    image: agent-harness-console:latest
    build:
      context: ./apps/agent-console
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://localhost}
        VITE_DEV_BEARER_TOKEN: ${CONSOLE_DEV_TOKEN:-}
        VITE_DEV_ADMIN_BEARER_TOKEN: ${CONSOLE_DEV_ADMIN_TOKEN:-}
    restart: unless-stopped

  static-assets:
    image: agent-harness-console:latest
    build:
      context: ./apps/agent-console
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://localhost}
        VITE_DEV_BEARER_TOKEN: ${CONSOLE_DEV_TOKEN:-}
        VITE_DEV_ADMIN_BEARER_TOKEN: ${CONSOLE_DEV_ADMIN_TOKEN:-}
    restart: unless-stopped
    volumes:
      - ./deploy/nginx-assets.conf:/etc/nginx/conf.d/default.conf:ro

  api-server:
    image: agent-harness-api-server:latest
    build:
      context: ./services/api-server
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 30
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_BASE_URL: ${PUBLIC_WEBSITE_BASE_URL:-https://localhost}
      CONSOLE_BASE_URL: ${PUBLIC_CONSOLE_BASE_URL:-https://localhost}
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://localhost}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-agent_harness}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      HARNESS_INITIAL_ADMIN_EMAIL: ${HARNESS_INITIAL_ADMIN_EMAIL:-}
      HARNESS_INITIAL_ADMIN_PASSWORD: ${HARNESS_INITIAL_ADMIN_PASSWORD:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OBSERVABILITY_EXPORT_DIR: /var/lib/agent-harness/exports
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport json, urllib.request\nr=urllib.request.urlopen('http://127.0.0.1:8000/api/health/readiness', timeout=5)\nraise SystemExit(0 if json.load(r).get('ready') else 1)\nPY"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    volumes:
      - observability-exports:/var/lib/agent-harness/exports

  db-migrate:
    image: agent-harness-api-server:latest
    build:
      context: ./services/api-server
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-agent_harness}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_harness}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_harness}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis-data:/data

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  observability-exports:
