version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/agent-console
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      agent-console-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /services/api-server
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
    groups:
      api-server-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
