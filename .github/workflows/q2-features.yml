name: Q2 Features CI

on:
  push:
    branches:
      - feature/onboarding-v1
      - feature/authn-authz-v2-sso
      - feature/observability-v2-external
      - feature/**  # All feature branches
  pull_request:
    branches:
      - main
    paths:
      - 'services/api-server/**'
      - 'apps/**'
      - '.github/workflows/q2-features.yml'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_harness_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/api-server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        working-directory: services/api-server
        run: |
          ruff check app tests --output-format=github

      - name: Type check with mypy
        working-directory: services/api-server
        continue-on-error: true
        run: |
          mypy app --ignore-missing-imports

      - name: Run database migrations
        working-directory: services/api-server
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_harness_test
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: services/api-server
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_harness_test
          ENVIRONMENT: test
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: services/api-server/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/agent-console/package-lock.json

      - name: Install dependencies
        working-directory: apps/agent-console
        run: npm ci

      - name: Lint
        working-directory: apps/agent-console
        run: npm run lint

      - name: Type check
        working-directory: apps/agent-console
        run: npm run type-check

      - name: Run tests
        working-directory: apps/agent-console
        run: npm test -- --coverage

      - name: Build check
        working-directory: apps/agent-console
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on vulnerabilities

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]
    if: always()

    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.backend-test.result }}" == "success" ]] && \
             [[ "${{ needs.frontend-test.result }}" == "success" ]] && \
             [[ "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
          else
            echo "❌ Some checks failed"
            exit 1
          fi
