name: Docker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate compose file when present
        if: ${{ hashFiles('deploy/docker-compose/docker-compose.yml') != '' }}
        env:
          AUTH_JWT_SECRET: ci-compose-config-validation-only
          HARNESS_SECRET_ENCRYPTION_KEY: ci-compose-config-validation-only
        run: docker compose -f deploy/docker-compose/docker-compose.yml config

      - name: Build api-server image when present
        if: ${{ hashFiles('services/api-server/Dockerfile') != '' }}
        run: docker build -t harness-api-server:ci services/api-server

      - name: Build worker image when present
        if: ${{ hashFiles('services/worker/Dockerfile') != '' }}
        run: docker build -t harness-worker:ci services/worker
