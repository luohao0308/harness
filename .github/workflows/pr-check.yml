name: PR Check

on:
  pull_request:
    branches:
      - main
      - "p7-*"
      - "plan-*"

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test commit policy
        run: python3 scripts/test-commit-message-policy.py
      - name: Validate pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git log --no-merges --format=%s "${BASE_SHA}..HEAD" \
            | python3 scripts/validate-commit-message.py --stdin --label commit
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" \
            | python3 scripts/validate-commit-message.py --stdin --label "PR title"

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install backend
        working-directory: services/api-server
        run: uv sync --frozen --extra dev
      - name: Ruff
        working-directory: services/api-server
        run: uv run --frozen ruff check app tests

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/agent-console/package-lock.json
      - name: Typecheck
        working-directory: apps/agent-console
        run: |
          npm ci
          npm run lint -- --pretty false

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: harness
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://harness:harness@localhost:5432/harness
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/agent-console/package-lock.json
      - name: Build frontend renderer for harnessd integration
        working-directory: apps/agent-console
        run: |
          npm ci
          npm run build
      - name: Generate ephemeral SAML test credentials
        run: bash scripts/generate-test-saml-certs.sh services/api-server/certs
      - name: Install backend
        working-directory: services/api-server
        run: uv sync --frozen --extra dev --extra sidecar
      - name: Pytest
        working-directory: services/api-server
        run: uv run --frozen pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/agent-console/package-lock.json
      - name: Vitest
        working-directory: apps/agent-console
        run: |
          npm ci
          npm test -- --run --pool forks --poolOptions.forks.singleFork

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/agent-console/package-lock.json
      - name: Build and check bundle
        working-directory: apps/agent-console
        run: |
          npm ci
          npm run build
          ../../scripts/check-bundle-size.sh dist

  migration-id-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Alembic migration seed IDs
        run: python3 scripts/check-migration-ids.py services/api-server/alembic/versions

  migration-preflight:
    runs-on: ubuntu-latest
    needs: migration-id-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: harness
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Alembic upgrade head
        working-directory: services/api-server
        env:
          DATABASE_URL: postgresql+psycopg://harness:harness@localhost:5432/harness
        run: |
          uv sync --frozen --extra dev
          uv run --frozen alembic upgrade head

  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate docs
        run: python3 scripts/validate-docs.py

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
