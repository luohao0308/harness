name: Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        working-directory: services/api-server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check required AI docs
        run: |
          test -f docs/ai/README.md
          test -f docs/ai/00-execution-protocol.md
          test -f docs/ai/01-task-progress.md
          test -f docs/ai/task-progress.yaml
          test -f docs/human/10-task-progress.md
          test -f docs/ai/stages/01-agent-workspace-console.md
          test -f docs/ai/stages/02-agent-studio-config.md
          test -f docs/ai/stages/03-harness-tool-mcp.md
          test -f docs/ai/stages/04-event-sourcing-replay-ui.md
          test -f docs/ai/stages/05-eval-regression.md
          test -f docs/ai/stages/06-warmpool-infra.md
          test -f docs/ai/stages/07-private-deployable-harness-chain.md

      - name: Check docs avoid loose wording
        run: |
          if grep -RInE "TODO|待定|稍后|可能|也许|大概|暂定|视情况|等等" docs/ai docs/api docs/evals docs/security docs/qa docs/demo docs/runbooks; then
            exit 1
          fi

      - name: Run Spec Mode docs validation
        run: python3 scripts/validate-docs.py

      - name: Check Help Center content
        run: python3 scripts/check-help-content.py

      - name: Generate API reference
        run: python3 scripts/generate-api-docs.py

      - name: Check generated API reference is current
        run: git diff --exit-code docs/api-reference
