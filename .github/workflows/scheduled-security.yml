name: Scheduled Security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/agent-console/package-lock.json
      - name: pip-audit backend
        working-directory: services/api-server
        run: |
          python -m pip install --upgrade pip pip-audit
          python -c "import pathlib, tomllib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); pathlib.Path('/tmp/harness-requirements.txt').write_text('\n'.join(data['project']['dependencies']) + '\n')"
          pip-audit -r /tmp/harness-requirements.txt
      - name: npm audit frontend
        working-directory: apps/agent-console
        run: |
          npm ci
          npm audit --audit-level=high
