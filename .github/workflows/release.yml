name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/harness

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  changelog-from-commits:
    runs-on: ubuntu-latest
    needs: verify-tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release changelog
        run: scripts/changelog-from-tags.sh "${GITHUB_REF_NAME}" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-image-tagged:
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release images
        run: |
          docker build -f services/api-server/Dockerfile.production -t "${IMAGE_PREFIX}-api:${GITHUB_REF_NAME}" services/api-server
          docker build -f apps/agent-console/Dockerfile.production -t "${IMAGE_PREFIX}-console:${GITHUB_REF_NAME}" apps/agent-console
          docker push "${IMAGE_PREFIX}-api:${GITHUB_REF_NAME}"
          docker push "${IMAGE_PREFIX}-console:${GITHUB_REF_NAME}"

  helm-publish:
    runs-on: ubuntu-latest
    needs: verify-tag
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package helm chart
        run: |
          helm package deploy/helm/harness --destination dist/helm --app-version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-release-chart
          path: dist/helm/*.tgz

  desktop-build:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: verify-tag
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: x64
            os: macos-15-intel
            script: dist:mac
          - platform: win
            architecture: x64
            os: windows-latest
            script: dist:win
          - platform: linux
            architecture: x64
            os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/agent-console/package-lock.json
            apps/desktop-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Build Agent Console renderer
        working-directory: apps/agent-console
        run: |
          npm ci
          npm run build
      - name: Build native harnessd sidecar
        working-directory: services/api-server
        run: |
          uv sync --extra sidecar --frozen
          uv run --extra sidecar python scripts/build-harnessd.py --dist-dir ../../apps/desktop-app/resources
      - name: Verify matching native sidecar
        shell: bash
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          runtime_root="apps/desktop-app/resources/runtime/$(node -p 'process.platform')/${{ matrix.architecture }}"
          node - "$runtime_root" "${{ matrix.architecture }}" <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const root = path.resolve(process.argv[2])
          const expectedArch = process.argv[3]
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'runtime-manifest.json'), 'utf8'))
          const expectedExecutable = process.platform === 'win32' ? 'harnessd/harnessd.exe' : 'harnessd/harnessd'
          if (manifest.schema_version !== 2
            || manifest.platform !== process.platform
            || manifest.architecture !== expectedArch
            || manifest.executable !== expectedExecutable
            || typeof manifest.files !== 'object'
            || manifest.files === null
            || manifest.files[expectedExecutable] !== manifest.sha256) {
            throw new Error('native sidecar manifest does not match the schema-v2 onedir contract')
          }
          const executable = path.join(root, ...expectedExecutable.split('/'))
          const checksum = crypto.createHash('sha256').update(fs.readFileSync(executable)).digest('hex')
          if (checksum !== manifest.sha256) throw new Error('native sidecar entry checksum does not match')
          NODE
      - name: Install desktop dependencies
        working-directory: apps/desktop-app
        run: npm ci
      - name: Test desktop release and startup contracts
        working-directory: apps/desktop-app
        run: |
          npm run test -- src/__tests__/desktop-updates.test.ts src/__tests__/crash-reporting.test.ts src/__tests__/main.test.ts src/services/__tests__/desktop-telemetry.test.ts src/services/__tests__/startup-performance.test.ts src/services/__tests__/local-runtime.test.ts src/services/__tests__/local-runtime-native.integration.test.ts
          npm run test:startup-budget
      - name: Install Linux desktop packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Build desktop installer
        working-directory: apps/desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_DESKTOP_UPDATE_CHANNEL: ${{ contains(github.ref_name, '-beta.') && 'beta' || 'stable' }}
          HARNESS_DESKTOP_SENTRY_DSN: ${{ secrets.HARNESS_DESKTOP_SENTRY_DSN }}
          SENTRY_RELEASE: harness-desktop@${{ github.ref_name }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CSC_LINK || matrix.platform == 'win' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Check packaged desktop startup budget (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop-app
        run: xvfb-run -a npm run check:startup-budget
      - name: Check packaged desktop startup budget
        if: matrix.platform != 'linux'
        working-directory: apps/desktop-app
        run: npm run check:startup-budget
      - name: Upload desktop sourcemaps to Sentry
        if: matrix.platform == 'linux'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: harness-desktop@${{ github.ref_name }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Skipping Sentry sourcemap upload; Sentry release secrets are not configured."
            exit 0
          fi
          npx -y @sentry/cli releases new "$SENTRY_RELEASE" || true
          npx -y @sentry/cli releases files "$SENTRY_RELEASE" upload-sourcemaps apps/desktop-app/dist --rewrite
          npx -y @sentry/cli releases finalize "$SENTRY_RELEASE"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-${{ matrix.platform }}
          path: |
            apps/desktop-app/release/*.AppImage
            apps/desktop-app/release/*.blockmap
            apps/desktop-app/release/*.deb
            apps/desktop-app/release/*.dmg
            apps/desktop-app/release/*.exe
            apps/desktop-app/release/*.rpm
            apps/desktop-app/release/latest*.yml
            apps/desktop-app/release/*.zip
            apps/desktop-app/dist/startup-budget-report-*.json
          if-no-files-found: error

  desktop-startup-evidence:
    name: Validate Desktop startup evidence
    runs-on: ubuntu-latest
    needs: desktop-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-desktop-*
          path: dist/desktop-evidence
          merge-multiple: false
      - name: Validate cross-platform startup reports
        run: >-
          node apps/desktop-app/scripts/validate-startup-budget-artifacts.mjs
          dist/desktop-evidence
          dist/desktop-startup-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-evidence
          path: dist/desktop-startup-evidence.json
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs:
      - changelog-from-commits
      - build-image-tagged
      - helm-publish
      - desktop-build
      - desktop-startup-evidence
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: helm-release-chart
          path: dist/helm
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-desktop-*
          path: dist/desktop
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: desktop-startup-evidence
          path: dist/desktop
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *"-beta."* ]]; then
            release_flags+=(--prerelease)
          fi
          mapfile -d '' desktop_assets < <(find dist/desktop -type f -print0)
          gh release create "$GITHUB_REF_NAME" dist/helm/*.tgz "${desktop_assets[@]}" \
            --title "Harness ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${release_flags[@]}"

  update-deployment-yaml:
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ops PR branch
        run: |
          branch="release/${GITHUB_REF_NAME}-helm-values"
          git checkout -b "$branch"
          python3 - <<'PY'
          import pathlib, os
          path = pathlib.Path("deploy/helm/harness/values.yaml")
          text = path.read_text()
          tag = os.environ["GITHUB_REF_NAME"]
          text = text.replace("agent-harness-api-server:latest", f"agent-harness-api-server:{tag}")
          text = text.replace("agent-harness-console:latest", f"agent-harness-console:{tag}")
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Prepare Helm values for ${GITHUB_REF_NAME}" || exit 0
          git push origin "$branch"
          gh pr create --title "Prepare Helm values for ${GITHUB_REF_NAME}" --body "Updates default Helm image tags for release ${GITHUB_REF_NAME}." --base main --head "$branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
