post_stage_hardening:
  - id: dify-grounded-answer-evidence-use
    date: 2026-05-26
    status: verified
    demo: Workspace chat now answers from accepted Dify connector evidence instead of asking for company context after retrieval has already returned records.
    verification_result: passed
    verification_commands:
      - cd services/api-server && uv run pytest tests/test_agents.py::test_agent_workspace_chat_stream_falls_back_when_model_ignores_dify_evidence tests/test_knowledge_connectors.py::test_dify_connector_retrieval_calls_provider_when_local_evidence_is_insufficient -q
      - cd services/api-server && uv run pytest tests/test_agents.py tests/test_knowledge_connectors.py -q
      - cd services/api-server && uv run ruff check app tests
      - Restarted local API in tmux session `harness-api-knowledge-edit` and confirmed `GET /health` returned 200.
      - Live `ground_query` run `ecd15f37-7a3e-4752-a513-38aab367882e` for `公司的愿景与价值观是什么` returned `grounding_provider=dify_connector`, `hit_count=3`, `[D1]` 企业愿景, and `[D2]` 长期愿景.
      - Live Workspace chat run `ec724c8b-c0ea-4918-8adf-1e3ba861443f` returned the Dify-backed answer with `[D1]`, `[D2]`, `[D3]` citations and evidence message `Local knowledge is insufficient; Dify connector grounded the answer.`
      - Expanded the ignored-evidence detector for the observed `没有指明具体是哪家公司 / 补充一下公司名称` wording, reran `tests/test_agents.py tests/test_knowledge_connectors.py -q` with `93 passed`, reran Ruff, restarted local API, and live Workspace chat run `8e428b6b-42e2-4686-b066-3fb99e837b16` returned the Dify-backed answer.
    acceptance_notes:
      - `Knowledge evidence follows` now explicitly instructs the model to answer from retrieved evidence when it contains a direct answer, and to only state missing parts when evidence is partial.
      - Workspace chat adds a deterministic fallback for grounded responses whose model text still asks for missing company/source context; it renders the accepted retrieval snippets with their citation keys instead of emitting a clarification question.
      - The fallback activates only when `grounding.grounded` is true and citation records exist, so unresolved secrets, provider errors, and empty Dify/Coze results are still reported as insufficient evidence.
      - Regression coverage simulates Dify returning company-vision records while the model asks for a company name; the final SSE content now includes the Dify records and `[D1]` / `[D2]`.
      - The regression now covers the exact observed wording: `由于你没有指明具体是哪家公司...补充一下公司名称`.
      - Live evidence showed Dify returned at least two records: `[D1]` `企业愿景 > 成为客户最信赖的视觉创意伙伴，用设计创造商业价值` and `[D2]` `长期愿景` with the international/design benchmark/world/social-good bullets.

