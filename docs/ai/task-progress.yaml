      - Recent run rows now include per-run cache hit rate plus hit/miss counts, while retaining optimizer plan, saved tokens, prompt tokens, omit reasons, and Run Detail links.
      - Playwright desktop 1440x900 and mobile 390x844 smoke checks confirmed /token-savings loads, shows cache hit rate and saved-token data, has zero document horizontal overflow, and reports no browser console errors.
