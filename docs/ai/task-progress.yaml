      - Marketplace preflight uses `POST /api/tools/capabilities/preflight/marketplace`, registers registry metadata only, does not fetch or DNS-resolve homepage/remote URLs, and therefore avoids the previous `public source resolver returned private, loopback, link-local, or metadata address` 400 while keeping strict public URL download validation unchanged.
