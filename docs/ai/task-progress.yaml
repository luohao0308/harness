  - id: coze-connector-runtime-retrieval
    date: 2026-05-26
    status: verified
    demo: Coze knowledge connectors are now usable runtime retrieval connectors with frontend-managed API key storage and source-bound grounding evidence when local Knowledge/RAG is insufficient.
    verification_result: passed
    verification_commands:
      - cd services/api-server && uv run pytest tests/test_knowledge_connectors.py::test_coze_connector_retrieval_calls_provider_when_local_evidence_is_insufficient tests/test_knowledge_connectors.py::test_coze_connector_runtime_uses_frontend_stored_secret tests/test_knowledge_connectors.py::test_coze_adapter_posts_configured_dataset_retrieve_shape tests/test_knowledge_connectors.py::test_coze_adapter_reports_provider_error_body -q
      - cd services/api-server && uv run pytest tests/test_knowledge_connectors.py tests/test_knowledge_rag.py -q
      - cd services/api-server && uv run ruff check app tests
      - cd apps/agent-console && npm test -- Knowledge
      - cd apps/agent-console && npm run lint -- --pretty false
      - cd apps/agent-console && npm run build
      - curl --noproxy '*' -sS -m 5 http://127.0.0.1:8000/health
      - Live API smoke on `127.0.0.1:8000`: create temporary Coze connector with `connector_secret_value`, response returned `connector_release_state=usable`, `connector_validation_status=ready`, `connector_secret_configured=true`, and DELETE cleanup returned 204.
      - Live runtime smoke on `127.0.0.1:8000` with a temporary local Coze-compatible retrieval endpoint: Workspace chat returned `Local knowledge is insufficient; Coze connector grounded the answer`, Run workspace grounding showed `grounding_provider=coze_connector`, one `coze_connector` hit, `[C1]` citation, and DELETE cleanup returned 204.
    acceptance_notes:
      - Coze is now in the usable connector release class and counts toward complete usable knowledge sources when endpoint, secret_ref, and dataset_id are valid.
      - Runtime grounding attempts Coze after local Knowledge/RAG is insufficient and before Dify/web fallback; accepted Coze results create `coze_connector` retrieval hits, `[C1]` citations, prompt-manifest source snapshots, and connector policy audit evidence.
      - The `/knowledge` / Knowledge Management connector dialog stores Coze API keys through `connector_secret_value`; backend runtime resolves `secret://coze` from service-side connector secret storage before environment fallback.
      - Raw Coze keys are not written into `KnowledgeSource.settings_json`, source responses, prompt manifests, retrieval hits, or policy audit safe metadata; responses expose only `connector_secret_configured` and the secret reference.
      - Missing Coze secrets, raw-secret-looking `secret_ref` values, and Coze provider HTTP failures produce visible runtime evidence messages and denied connector audit rows without fabricating grounded answers.
      - Coze connector config documents remain `connector_config_only` and `retrieval_eligible=false`; runtime grounding trusts only source-bound connector retrieval results, not the saved config text.
      - Live runtime behavior was verified through a local Coze-compatible endpoint; external Coze provider retrieval was not run because no real Coze credential/dataset was available. The adapter uses a configurable endpoint, defaulting to `https://api.coze.cn/v1/datasets/{dataset_id}/retrieve`.

  - id: coze-official-document-list-ranking-and-dify-fallback
    date: 2026-05-26
    status: verified
    demo: Coze Cloud base endpoint retrieval now uses the official document-list/content path with stricter Chinese relevance filtering, so unrelated Coze hits no longer block Dify fallback.
    verification_result: passed
    verification_commands:
      - cd services/api-server && uv run pytest tests/test_knowledge_connectors.py::test_coze_adapter_uses_official_document_list_for_base_endpoint tests/test_knowledge_connectors.py::test_coze_document_list_rejects_weak_cjk_overlap tests/test_knowledge_connectors.py::test_coze_empty_results_fall_through_to_dify_connector tests/test_knowledge_connectors.py::test_coze_adapter_still_supports_explicit_custom_retrieve_endpoint -q
      - cd services/api-server && uv run pytest tests/test_knowledge_connectors.py -q
      - cd services/api-server && uv run pytest tests/test_knowledge_connectors.py tests/test_knowledge_rag.py -q
      - cd services/api-server && uv run ruff check app tests
      - Restarted local API in tmux session `harness-api-knowledge-edit` and confirmed `GET /health` returned 200.
      - Live adapter probe: query `公司的愿景与价值观是什么` returned 0 Coze results from saved Coze dataset `7629341424630448134`, while `厦门科技馆的主题是什么` returned 3 Coze results.
      - Live `ground_query`: `厦门科技馆的主题是什么` returned `grounding_provider=coze_connector`; `公司的愿景与价值观是什么` returned `grounding_provider=dify_connector`, `dify_result_count=3`, and evidence message `Dify connector grounded the answer`.
    acceptance_notes:
      - Coze base endpoints such as `https://api.coze.cn` call `/open_api/knowledge/document/list`, coerce numeric Coze dataset ids to integers for that API, fetch the signed document content URL only in memory, split bounded text chunks, and rank them locally.
      - Explicit custom Coze retrieval endpoints ending in `/retrieve`, `/retrieval`, or `/search` still use the configured endpoint contract and are not affected by the document-list local ranking path.
      - The local Coze document-list ranker now requires meaningful Chinese core-term overlap and filters weak overlaps below the minimum document score; partial terms such as `价值` no longer make a science-museum document answer `公司的愿景与价值观是什么`.
      - Runtime fallback remains local Knowledge/RAG first, Coze second, Dify third, then web fallback; when Coze returns no accepted results, Dify is attempted in the same grounding request.

