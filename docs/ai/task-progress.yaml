      - Marketplace HTTP aggregation now uses `trust_env=False`, so local SOCKS proxy environment variables cannot crash the API when `socksio` is absent; external source failures still degrade to local curated entries plus source errors.
      - Repeated public preflight for the same marketplace package is idempotent: the backend reuses the existing `(organization_id, package_key, source_sha256)` package, records `idempotent_preflight`, and avoids the duplicate-key 500.
      - After an external market entry is preflighted, the market dialog keeps the next actions in the right-side install workbench beside the results: approve the staged version, then install it to the selected agent.
      - Marketplace `mcp_server` packages now synthesize executable MCP `tool_metadata` from the approved manifest when the registry entry does not provide explicit tool metadata, so installed entries such as Brave can be resolved by ToolRunner after Agent attachment.
