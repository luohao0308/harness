      - ContextAssemblyService resolves enabled Agent optimizer attachments in priority order and conservatively overlays the default token strategy with max candidate token ratio, section limits, drop order, compressed-summary preference, and low-cost route hints.
      - System/developer authority, pinned context, and current user goal remain protected from optimizer omission; invalid, disabled, and cross-org optimizer attachments do not affect context assembly.
      - ContextAssemblyManifest token_budget_json now records baseline_strategy, effective_strategy, optimizer_capability_version_ids, optimizer_policy_hash, and optimizer_decisions; included/omitted refs carry optimizer metadata and omit reasons when affected.
      - Model call request audit, Run Detail token optimization projection, and Observability token summary now expose optimizer version/hash/decision evidence, estimated savings, actual prompt tokens, and low-cost route reasons.
      - Agent Studio shows a simple Token 省用方案 selector and current preset state; Tool Registry install/upload/preflight flows still accept context_optimizer packages for advanced users; Run Detail displays optimizer version, policy hash, and decision count.
      - Added /api/observability/token-savings and /token-savings so normal users can see estimated saved tokens, actual prompt/total tokens, savings percent, active built-in plan names, low-cost routing evidence, and recent run omit reasons without reading raw manifests.
      - Token 节省 is linked from the console sidebar and links each row back to Run Detail for deeper evidence.
      - Fixed the runtime boundary so context_optimizer attachments are excluded from executable ToolRegistry/ToolRunner resolution and cannot trigger "capability version is not executable" during tool registry listing or tool execution.
      - Fixed the zero-savings root cause for short and medium workspace chats: max_candidate_tokens_ratio now applies to the current candidate context size before comparing with the large configured context window budget.
      - Live default workspace smoke on 2026-05-25 created run 16be7fb1-e16c-427d-90a9-a48d78fdd439 with 均衡 enabled, candidate 4014 tokens, included 3070, saved 944 tokens, savings 23.52%, and omitted_refs reason optimizer_budget.
