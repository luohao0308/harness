      - V6 PRD and test spec remain the authoritative plan docs at `.omx/plans/prd-local-agent-claude-code-permission-bridge-v6.md` and `.omx/plans/test-spec-local-agent-claude-code-permission-bridge-v6.md`.
      - V6 keeps API/DB as the authority for sessions, Runs, events, approvals, tool calls, pending changes, command lifecycle, assistant completion, and audit; the local bridge only captures intent, polls decisions, and reports back receipts and results.
      - Claude V6 is now normalized to `permission_bridge=harness_local_tool_request_v1`, `execution_mode=agent_sdk_intent_capture_harness_executor`, `permission_bridge_execution=harness_owned_executor`, and `sdk_native_tool_execution_enabled=false`; the Claude SDK callback denies after Harness-owned execution so native side-effect execution cannot run twice.
      - V6 enablement is gated by both scoped pairing entitlement and capability normalization; V5 Claude connections cannot self-upgrade to V6 through heartbeat and continue to behave as headless no-tools fallback connections.
      - Host-tool requests from Claude V6 now create or bind the existing V3 `LocalAgentToolRequest`, `ToolApproval`, `ToolCall`, `AgentEvent`, `LocalAgentPendingChange`, and `LocalAgentCommand` records before local side effects.
      - Modified approval now updates the executable input hash, requires write/apply-patch pending-change preview refresh against the approved modified input, fail-closes stale original preview results, and records the refreshed preview on both the local request and approval audit path.
      - Task cancel now terminalizes pending Claude V6 local-tool state, including approvals, tool calls, pending changes, commands, and bridge tasks, and late approval or execution polling fails closed.
      - The hao CLI V6 path now supports the Claude Agent SDK permission callback, explicit fake-SDK fixture mode, and deterministic smoke coverage for unavailable SDK, approved execution, cancelled execution, V5 heartbeat upgrade denial, and modified-approval refresh execution.
      - Agent Studio now distinguishes Claude Code V5 from Claude Code V6, generates scoped pairing commands with `--permission-bridge sdk`, and marks V6 connections as permission-bridge plus host-tool-approval capable.
      - Final implementation review returned architecture `CLEAR` and code/security `APPROVE`; closeout-only follow-up was correcting stale handoff wording and validation counts.
      - Native Claude Code resume, deferred tool resume after process exit, live credential UX, remote-control/web/cloud sessions, MCP/plugins/hooks/subagents/browser/computer-use, and server-side Claude credential handling remain out of V6 scope.

