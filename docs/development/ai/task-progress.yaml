      - Token 节省 is linked from the console sidebar and links each row back to Run Detail for deeper evidence.
      - Fixed the runtime boundary so context_optimizer attachments are excluded from executable ToolRegistry/ToolRunner resolution and cannot trigger "capability version is not executable" during tool registry listing or tool execution.
      - Fixed the zero-savings root cause for short and medium workspace chats: max_candidate_tokens_ratio now applies to the current candidate context size before comparing with the large configured context window budget.
