      - Compose injects the key only into API, Agent worker, Assignment worker, Team Runtime, and Sandbox worker; migration, recovery, and warm-pool services do not receive it. Helm injects it only into API pods.
      - The Python gateway now sends a stable Harness User-Agent on complete and stream requests so Cloudflare does not reject the default urllib client signature.
      - Non-stream requests retain the interview-web payload by default, forward validated `max_output_tokens` and finite `0..2` temperature only when configured, and strictly collapse the provider's intermittent concatenated `chat.completion.chunk` response without accepting mixed, incomplete, post-terminal, malformed-usage, or cross-response data.
      - No real provider key or response body was written to tracked files or command output. The previous live-upstream evidence gap is closed.
      - The final repository-wide backend regression passes all 1418 tests after the compatibility and provider-input hardening changes.

