  - id: team-runtime-worker-autonomous-goals
    date: 2026-06-25
    status: completed
    demo: Active Team Goals can advance without a browser-triggered wake stream because a deployable Team Runtime worker scans active goals, chooses runnable agents, wakes them through the existing Team service, and records runtime tick/decision events.
    verification_result: targeted_passed
    verification_commands:
      - services/api-server/.venv/bin/python -m pytest services/api-server/tests/test_teams.py -q -> 46 passed
      - services/api-server/.venv/bin/python -m ruff check services/api-server/app/workers/team_runtime_worker.py services/api-server/tests/test_teams.py -> passed
      - services/api-server/.venv/bin/python -m py_compile services/api-server/app/workers/team_runtime_worker.py -> passed
      - AUTH_JWT_SECRET=<test-secret> HARNESS_SECRET_ENCRYPTION_KEY=<test-key> HARNESS_SECRET_ENCRYPTION_KEY_ID=<test-key-id> docker compose -f deploy/docker-compose/docker-compose.yml config -> passed
      - python3 scripts/validate-docs.py -> passed
      - git diff --check -> passed
    acceptance_notes:
      - Added `app.workers.team_runtime_worker` with a testable `tick_active_team_goals(...)` one-shot API and a `python -m app.workers.team_runtime_worker` service loop.
      - Runtime ticks scan only `AUTO_SUPERVISED_GOAL_STATUSES`, use Postgres advisory locking or a SQLite process lock, and cap both scanned goals and agent wakes per tick.
      - The worker reuses `TeamSessionService.wake_agent(...)`; it does not introduce a new worker process pool or alternate Team execution semantics.
      - Decision order is stale wake timeout recovery, unread mailbox recipient, open assigned task owner, one-time active-goal bootstrap to the leader, then wait.
      - Bootstrap state is idempotent through `goal.supervisor_state_json.runtime_bootstrapped_at`, so a goal without a user message is started once and not spammed on later ticks.
      - Runtime evidence is written through `TEAM_RUNTIME_TICK`, `TEAM_RUNTIME_DECISION`, and `TEAM_RUNTIME_WAKE_FAILED`; the long-running loop logs and survives isolated tick failures.
      - Docker Compose, systemd, local-development runbook, deployment runbook, and Promtail container-log discovery now include `team-runtime`.
      - This completes the first autonomous Team Goal runtime layer; it is still not a separate persistent pool of OS worker agents, and that larger process-manager design remains future work.

