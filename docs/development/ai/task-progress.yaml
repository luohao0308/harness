    acceptance_notes:
      - The Agent Studio local Agent dialog no longer exposes a pre-command adapter selector. It generates a single generic command and labels the flow as generate command -> run locally -> choose/name detected Agents.
      - Frontend pairing-token creation now sends real default multi-adapter scope `["hao", "codex", "claude_code"]` and excludes only `fake` from the default generic pairing scope.
      - The detected list is stable-sorted by adapter/name/created/id and is now strict-checkbox controlled: opening the wizard, regenerating the command, and polling discovery do not auto-select any detected local Agent; only currently checked rows are PATCH-confirmed and saved.
      - Saving selected detected Agents now treats unchecked rows as "do not connect": the current pairing token is revoked before save, the wizard refreshes the latest connection snapshot, unchecked detected or same-token late connections are revoked, selected rows keep their display-name PATCH, and 0 selected rows can be confirmed to disconnect every detected local Agent.
      - The strict checkbox regression covers a previously confirmed old Codex connection appearing with a newly discovered hao row; selecting only hao PATCHes hao, revokes Codex, and never sends a Codex PATCH.
      - The late Codex regression covers a Codex connection that registers from the same pairing token after the user clicks save with only hao selected; the save flow revokes that late Codex while the different-token regression proves unrelated late connections are not touched by the current wizard.
      - The full-flow parity regression is API-level deterministic coverage rather than a real generated `npx ... bridge pair --daemon` end-to-end daemon run. It proves explicit pairing-token creation, bridge registration, pre-confirm execution rejection, PATCH confirmation, message send, bridge task pull/ack, scoped local bridge SSE (`delta`, `usage`, `done`), direct platform model SSE comparison, all seven local tool categories (`read_file`, `list_files`, `write_file`, `run_shell`, `run_tests`, `git`, `network`), pending-change committed hash evidence for `write_file`, model-call reuse, task events, event stream, model-calls API, and observability summary. The separate live `npx` smoke only proved local-path command/help generation and temporary API registration/capability cleanup without running a long-lived daemon.
      - New local-agent registrations are projected as `pending_confirmation` until the user PATCH-confirms them from the onboarding dialog; unconfirmed or `status=pending_confirmation` connections may heartbeat/list for discovery but cannot bind, send, pull bridge tasks, ack, emit events, request/poll/result tools, report commands, cancel commands, or retry commands. Backend executable gates now require explicit `onboarding_confirmed=true` plus non-`pending_confirmation`, heartbeat cannot promote pending rows to online, and PATCH confirm can recover dirty pending rows.
      - hao bridge run treats unconfirmed heartbeat or bridge-task pull rejection as a wait state, so discovered-but-unconfirmed Codex/Claude daemons do not pull tasks, resume pending tools, or exit before the user confirms them.
      - Agent Studio marks unconfirmed rows as `待确认` / `未接入`, and both AgentWorkspacePage and WorkspaceShellBar defensively filter unconfirmed, `pending_confirmation`, or revoked local connections from Workspace targets and the top-left Agent/local-Agent target picker, including stale-cache dirty data where the confirmation flag and status disagree. WorkspaceShellBar now also requires `onboarding_confirmed === true`, matching AgentWorkspacePage and hiding malformed cached rows where the confirmation field is missing.
      - Revoked local connections are now rejected by the shared executable owner path; retrying an old failed local command after revoke returns 403 and does not create a new approved `LocalAgentToolRequest` or pending `LocalAgentCommand`.
      - The generated pairing command now uses configured `API_BASE_URL` / `get_settings().api_base_url` instead of a hardcoded `127.0.0.1:8000` base URL.
      - Host-tool protocol access now depends on server-owned `metadata_json.local_tool_policy=harness_approved_local_bridge`; client-supplied `local_tool_policy` and `server_permission_bridge_entitlement` metadata keys are stripped before the server writes its own values, so fake/untrusted adapters cannot self-authorize by metadata spoofing.
      - User-facing local readiness/counts now only include real default discovery adapters; explicit `fake` bridge connections no longer light up the Agent readiness ring or local connection count.
      - hao bridge pair without `--adapter` auto-detects hao, Codex CLI, and Claude Code; each paired adapter persists bridge state under its own `HAO_HOME` child directory so daemon state files do not overwrite each other.
      - The user-facing private/dev connection command is now the Coze-style `npx -y /path/to/harness/services/api-server bridge pair ...` form and does not require choosing an adapter before copying/running it; it avoids the unpublished `@harness/hao@latest` npm 404.
      - LOCAL_AGENT_NPX_PACKAGE can override the package spec for published deployments, and `LOCAL_AGENT_NPX_REGISTRY` is added only for registry package specs, not local paths, URLs, or git/GitHub npm specs.
      - Codex CLI and Claude Code now normalize to hao-parity Harness-approved local tool capability (`host_read`, `host_write`, `shell`, `git`, `network`) with approval/audit metadata, stream-token resume support, and context replay recovery.
      - Codex CLI and Claude Code still cannot bypass Harness approval by reporting legacy `tool_result` events or unapproved command events; both adapters force `context_replay_new_session` when bindings ask for native resume.
      - Explicit `--adapter` remains available for tests and advanced adapter-scoped paths, including explicit fake, adapter-specific Codex/Claude Code V5, and Claude Code V6 permission-bridge scenarios.
