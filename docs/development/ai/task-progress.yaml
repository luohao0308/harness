      - Agent Workspace no longer lets a historical failed local bridge task steal `activeLeafId` from newer local-agent messages. The old failed task remains inspectable as a historical branch, but a later successful assistant reply stays on the visible main path.
      - Agent Workspace `恢复` first refreshes local connection, binding, message, task, and active Run state; if the selected connection is still offline, it shows the recovery command inline with `复制命令` and `我已执行，刷新`.
      - The command panel disappears after the bridge reports `online` or `busy`, keeping queued Local Agent messages attached to the existing confirmed connection rather than creating a new pending-confirmation pairing flow.

