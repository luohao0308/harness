      - The configured provider is `chybenzun-openai-compatible` at `https://chybenzun.top/v1`, using `chat_completions`, `deepseek-v4-flash` by default, and the reference 12-model allowlist.
      - Harness intentionally supports only the active `chat_completions` contract; the reference project's optional `responses` protocol remains explicitly unsupported.
      - Platform credentials stay server-side, are redacted from Settings repr, cannot be claimed by forged provider metadata, and are never accepted from browser environment templates.
      - Agent and Team complete/stream paths enforce the platform allowlist and resolve the exact provider/model row; production startup fails when the platform key is empty or an example placeholder.
