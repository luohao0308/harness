global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: api-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-server:8000

  - job_name: subagent-recovery
    metrics_path: /metrics
    static_configs:
      - targets:
          - subagent-recovery:9102

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
