server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: (agent-assignment-worker|agent-console|agent-worker|api-server|db-migrate|grafana|loki|nginx|otel-collector|postgres|prometheus|promtail|redis|sandbox-worker|subagent-recovery|team-runtime|tempo|warm-pool|web-site)
        action: keep
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
      - source_labels:
          - __meta_docker_container_name
        target_label: container
      - source_labels:
          - __meta_docker_container_id
        target_label: container_id
      - replacement: agent-harness
        target_label: app
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            task_id: task_id
            agent_run_id: agent_run_id
            event_type: event_type
      - labels:
          level:
          trace_id:
          task_id:
          agent_run_id:
          event_type:
