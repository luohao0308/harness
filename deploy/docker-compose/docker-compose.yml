services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web-site
      - api-server
      - agent-console
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/agent-harness.conf:/etc/nginx/conf.d/default.conf:ro

  web-site:
    image: agent-harness-web-site:latest
    build:
      context: ../../apps/web-site
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_CONSOLE_BASE_URL: ${PUBLIC_CONSOLE_BASE_URL:-http://127.0.0.1:5173}
    depends_on:
      api-server:
        condition: service_started
    ports:
      - "${WEBSITE_HTTP_PORT:-3000}:3000"

  agent-console:
    image: agent-harness-console:latest
    build:
      context: ../../apps/agent-console
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_DEV_BEARER_TOKEN: ${CONSOLE_DEV_TOKEN:-}
        VITE_DEV_ADMIN_BEARER_TOKEN: ${CONSOLE_DEV_ADMIN_TOKEN:-}
    depends_on:
      api-server:
        condition: service_started
    ports:
      - "${CONSOLE_HTTP_PORT:-5173}:80"

  api-server:
    image: agent-harness-api-server:latest
    build:
      context: ../../services/api-server
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BASE_URL: ${PUBLIC_WEBSITE_BASE_URL:-http://127.0.0.1:3000}
      CONSOLE_BASE_URL: ${PUBLIC_CONSOLE_BASE_URL:-http://127.0.0.1:5173}
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      HARNESS_INITIAL_ADMIN_EMAIL: ${HARNESS_INITIAL_ADMIN_EMAIL:-}
      HARNESS_INITIAL_ADMIN_PASSWORD: ${HARNESS_INITIAL_ADMIN_PASSWORD:-}
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DOCKER_HOST: unix:///var/run/docker.sock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_BASE_URL: http://prometheus:9090
      GRAFANA_BASE_URL: http://grafana:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: admin
      LOKI_BASE_URL: http://loki:3100
      OTEL_COLLECTOR_HTTP_URL: http://otel-collector:13133
      TEMPO_BASE_URL: http://tempo:3200
      OBSERVABILITY_EXPORT_DIR: /var/lib/agent-harness/exports
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "${API_HTTP_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - observability-exports:/var/lib/agent-harness/exports

  db-migrate:
    image: agent-harness-api-server:latest
    build:
      context: ../../services/api-server
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  agent-runtime-image:
    image: agent-runtime:latest
    build:
      context: ../../services/agent-runtime
    command: "true"

  agent-worker:
    image: agent-harness-api-server:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: python -m dramatiq app.workers.subagent_worker
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  agent-assignment-worker:
    image: agent-harness-api-server:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: python -m dramatiq app.workers.agent_assignment_worker --queues agent_assignments
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  subagent-recovery:
    image: agent-harness-api-server:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: python -m app.workers.subagent_recovery_worker
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SUBAGENT_RECOVERY_METRICS_PORT: 9102
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    expose:
      - "9102"

  team-runtime:
    image: agent-harness-api-server:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: python -m app.workers.team_runtime_worker
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TEAM_RUNTIME_INTERVAL_SECONDS: ${TEAM_RUNTIME_INTERVAL_SECONDS:-5}
      TEAM_RUNTIME_MAX_GOALS: ${TEAM_RUNTIME_MAX_GOALS:-20}
      TEAM_RUNTIME_MAX_WAKES_PER_TICK: ${TEAM_RUNTIME_MAX_WAKES_PER_TICK:-4}
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  warm-pool:
    image: agent-harness-api-server:latest
    depends_on:
      agent-runtime-image:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: python -m app.workers.warm_pool_service
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      DOCKER_HOST: unix:///var/run/docker.sock
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspaces:/var/lib/agent-harness/workspaces

  sandbox-worker:
    image: agent-harness-api-server:latest
    depends_on:
      agent-runtime-image:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: python -m dramatiq app.workers.subagent_worker --queues subagents
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED:-false}
      HARNESS_SECRET_ENCRYPTION_KEY: ${HARNESS_SECRET_ENCRYPTION_KEY:?HARNESS_SECRET_ENCRYPTION_KEY required}
      HARNESS_SECRET_ENCRYPTION_KEY_ID: ${HARNESS_SECRET_ENCRYPTION_KEY_ID:-primary-v1}
      DOCKER_HOST: unix:///var/run/docker.sock
      AI_PROVIDER_PROTOCOL: ${AI_PROVIDER_PROTOCOL:-chat_completions}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://chybenzun.top/v1}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-deepseek-v4-flash}
      AI_PROVIDER_MODELS: ${AI_PROVIDER_MODELS:-deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-chybenzun-openai-compatible}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://api-server:8000/mock-model}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-replace-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspaces:/var/lib/agent-harness/workspaces

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_harness"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_HTTP_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_ENABLE_ALPHA: "false"
    volumes:
      - ../monitoring/grafana-dashboard-agent-harness.json:/var/lib/grafana/dashboards/agent-harness.json:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - ../monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    depends_on:
      - tempo
    command:
      - --config=/etc/otel-collector.yml
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otel-collector.yml:ro

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo.yml
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ../monitoring/tempo.yml:/etc/tempo.yml:ro

volumes:
  agent-workspaces:
  loki-data:
  observability-exports:
  postgres-data:
  redis-data:
