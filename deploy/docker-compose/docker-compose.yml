services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web-site
      - api-server
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/agent-harness.conf:/etc/nginx/conf.d/default.conf:ro

  web-site:
    image: agent-harness-web-site:latest
    build:
      context: ../../apps/web-site
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_CONSOLE_BASE_URL: http://127.0.0.1:5173
    depends_on:
      api-server:
        condition: service_started
    ports:
      - "3000:3000"

  agent-console:
    image: agent-harness-console:latest
    build:
      context: ../../apps/agent-console
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
        VITE_DEV_BEARER_TOKEN: dev-engineer-token
    depends_on:
      api-server:
        condition: service_started
    ports:
      - "5173:80"

  api-server:
    image: agent-harness-api-server:latest
    build:
      context: ../../services/api-server
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      APP_ENV: production
      APP_BASE_URL: http://127.0.0.1:3000
      CONSOLE_BASE_URL: http://127.0.0.1:5173
      API_BASE_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_BASE_URL: http://prometheus:9090
      GRAFANA_BASE_URL: http://grafana:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: admin
      LOKI_BASE_URL: http://loki:3100
      OTEL_COLLECTOR_HTTP_URL: http://otel-collector:13133
      TEMPO_BASE_URL: http://tempo:3200
    ports:
      - "8000:8000"

  db-migrate:
    image: agent-harness-api-server:latest
    build:
      context: ../../services/api-server
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0

  agent-runtime-image:
    image: agent-runtime:latest
    build:
      context: ../../services/agent-runtime
    command: "true"

  agent-worker:
    image: agent-harness-api-server:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: python -m dramatiq app.workers.subagent_worker
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  subagent-recovery:
    image: agent-harness-api-server:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: python -m app.workers.subagent_recovery_worker
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SUBAGENT_RECOVERY_METRICS_PORT: 9102
    expose:
      - "9102"

  warm-pool:
    image: agent-harness-api-server:latest
    depends_on:
      agent-runtime-image:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: python -m app.workers.warm_pool_service
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspaces:/var/lib/agent-harness/workspaces

  sandbox-worker:
    image: agent-harness-api-server:latest
    depends_on:
      agent-runtime-image:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: python -m dramatiq app.workers.subagent_worker --queues subagents
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_harness
      REDIS_URL: redis://redis:6379/0
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspaces:/var/lib/agent-harness/workspaces

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_harness"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_ENABLE_ALPHA: "false"
    volumes:
      - ../monitoring/grafana-dashboard-agent-harness.json:/var/lib/grafana/dashboards/agent-harness.json:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    depends_on:
      - tempo
    command:
      - --config=/etc/otel-collector.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otel-collector.yml:ro

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo.yml
    ports:
      - "3200:3200"
    volumes:
      - ../monitoring/tempo.yml:/etc/tempo.yml:ro

volumes:
  agent-workspaces:
  loki-data:
  postgres-data:
  redis-data:
