apiVersion: v1
kind: Service
metadata:
  name: harness-api
spec:
  selector:
    app: harness-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: harness-console
spec:
  selector:
    app: harness-console
  ports:
    - name: http
      port: 80
      targetPort: 80
