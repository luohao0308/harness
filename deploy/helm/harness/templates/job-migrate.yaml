apiVersion: batch/v1
kind: Job
metadata:
  name: harness-db-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harness-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: harness-secrets
                  key: redis-url
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: harness-secrets
                  key: auth-jwt-secret
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harness-secrets
                  key: deepseek-api-key
