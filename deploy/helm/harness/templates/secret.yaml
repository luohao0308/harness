apiVersion: v1
kind: Secret
metadata:
  name: harness-secrets
type: Opaque
stringData:
  database-url: postgresql+psycopg://{{ .Values.env.postgresUser }}:{{ .Values.env.postgresPassword }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.env.postgresDb }}
  redis-url: redis://:{{ .Values.env.redisPassword }}@{{ .Values.redis.host }}:{{ .Values.redis.port }}/0
  auth-jwt-secret: {{ .Values.auth.jwtSecret | quote }}
  secret-encryption-key: {{ .Values.auth.secretEncryptionKey | quote }}
  secret-encryption-key-id: {{ .Values.auth.secretEncryptionKeyId | quote }}
  initial-admin-email: {{ .Values.auth.initialAdmin.email | quote }}
  initial-admin-password: {{ .Values.auth.initialAdmin.password | quote }}
  ai-provider-api-key: {{ .Values.env.aiProviderApiKey | quote }}
  model-gateway-api-key: {{ .Values.env.modelGatewayApiKey | quote }}
  deepseek-api-key: {{ .Values.env.deepseekApiKey | quote }}
