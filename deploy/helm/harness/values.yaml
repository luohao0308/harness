replicaCount: 2

image:
  api: agent-harness-api-server:latest
  console: agent-harness-console:latest
  pullPolicy: IfNotPresent

canary:
  enabled: false
  weight: 5
  image:
    api: agent-harness-api-server:latest
    console: agent-harness-console:latest

ingress:
  enabled: true
  host: harness.local
  className: nginx
  tlsSecretName: harness-tls

env:
  appEnv: production
  authPublicRegistrationEnabled: false
  apiBaseUrl: https://harness.local
  consoleBaseUrl: https://harness.local
  websiteBaseUrl: https://harness.local
  aiProviderProtocol: chat_completions
  aiProviderBaseUrl: https://chybenzun.top/v1
  aiProviderModel: deepseek-v4-flash
  aiProviderModels: deepseek-v4-flash,deepseek-v4-pro,glm-5.2,kimi-k2.7-code,kimi-k2.6,doubao-seed-2-1-turbo,doubao-seed-2-1-pro,qwen3.7-max,qwen3.7-plus,minimax-m3,step-3.7-flash,mimo-v2.5
  aiProviderName: chybenzun-openai-compatible
  # Server-only secret. Supply with a private values file or external secret manager.
  aiProviderApiKey: ""
  # Legacy local mock compatibility only.
  modelGatewayBaseUrl: http://harness-api:8000/mock-model
  modelGatewayApiKey: replace-me
  deepseekApiKey: ""
  postgresUser: agent
  postgresPassword: agent
  postgresDb: agent_harness
  redisPassword: agent-redis

auth:
  # Generate both startup secrets with: python3 scripts/generate-runtime-secrets.py
  jwtSecret: replace-with-openssl-rand-hex-32
  secretEncryptionKey: replace-with-generated-fernet-key
  secretEncryptionKeyId: primary-v1
  initialAdmin:
    # Used only when the users table is empty; remove after first successful boot.
    email: ""
    password: ""

postgres:
  host: postgres
  port: 5432

redis:
  host: redis
  port: 6379

resources:
  api:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  cpuAverageUtilization: 70

pdb:
  enabled: true
  minAvailable: 1
