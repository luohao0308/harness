server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent_api http://api-server:8000;
    set $web_site http://web-site:3000;

    client_max_body_size 25m;

    location ~ ^/api/tasks/.*/events/stream$ {
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # v4 agent-workspace-chat-v4-refine Req 6.4/6.5:
    # Dedicated SSE pipe for Workspace chat/plan streams. Mirrors the
    # `/api/tasks/.../events/stream` block above so proxy_buffering / cache
    # / chunked encoding stay off end-to-end and we re-assert
    # `X-Accel-Buffering: no` in case the upstream header is stripped.
    location ~ ^/api/agents/.*/runs/(chat|plan)/stream$ {
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /health {
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Agent Console SPA routes — anything consumed by React Router lives
    # inside the `agent-console` container. Without these explicit location
    # blocks the generic `/` below falls through to the Next.js web-site
    # container, which 404s on client-side routes like
    # `/agents/default/workspace`.
    set $agent_console http://agent-console:80;

    location /agents {
        proxy_pass $agent_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /runs {
        proxy_pass $agent_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tasks {
        proxy_pass $agent_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /console {
        proxy_pass $agent_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass $agent_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass $web_site;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
